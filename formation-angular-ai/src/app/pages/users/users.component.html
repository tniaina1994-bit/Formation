<div class="users">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Utilisateurs</h1>
  <div *ngIf="loading" class="text-gray-600">Chargement...</div>
  <div *ngIf="!loading && users.length === 0" class="text-gray-600">Aucun utilisateur trouvé.</div>
  <div *ngIf="!loading && users.length > 0" class="bg-white shadow overflow-hidden rounded-md">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nom</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Rôle</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let user of users">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ user.firstname }} {{ user.lastname }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ user.email }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ user.role || 'user' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
