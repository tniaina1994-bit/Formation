<div class="tasks">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Tâches</h1>
  <div *ngIf="loading" class="text-gray-600">Chargement...</div>
  <div *ngIf="!loading && projects.length === 0" class="text-gray-600">Aucun projet trouvé.</div>
  <div *ngFor="let project of projects" class="mb-8">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">{{ project.name }}</h2>
    <div *ngIf="!(tasksByProject[project.id]?.length)" class="text-gray-500 ml-4">Aucune tâche pour ce projet.</div>
    <div *ngIf="tasksByProject[project.id]?.length" class="bg-white shadow overflow-hidden rounded-md">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Titre</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Statut</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date limite</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let task of tasksByProject[project.id]">
            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ task.title }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ task.status }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ task.due_date | date:'short' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
